services:
  postgres-test:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    # Repeated schema/migration tests generate WAL quickly. These are test-only
    # resource limits; keep fsync and synchronous_commit enabled.
    command: ["postgres", "-c", "max_wal_size=128MB", "-c", "min_wal_size=32MB", "-c", "checkpoint_timeout=30s"]
    ports:
      - "127.0.0.1:55438:5432"
    environment:
      POSTGRES_USER: adi_test
      POSTGRES_PASSWORD: adi_test_local_only
      POSTGRES_DB: adi_test
    mem_limit: 1536m
    cpus: 1
    volumes:
      - ../../packages/storage/test/extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    tmpfs:
      - /var/lib/postgresql:rw,size=1024m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adi_test -d adi_test"]
      interval: 2s
      timeout: 2s
      retries: 15
