# Optional independent database. Never started or stopped by make dev.
services:
  postgres:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    restart: unless-stopped
    environment:
      POSTGRES_USER: adi_bootstrap
      POSTGRES_DB: adi
      POSTGRES_PASSWORD: ${ADI_PG_ADMIN_PASSWORD:?provide a database bootstrap password}
      ADI_APP_DB_PASSWORD: ${ADI_APP_DB_PASSWORD:?provide the application role password}
    ports: ["127.0.0.1:${ADI_PG_HOST_PORT:-55432}:5432"]
    volumes:
      - type: bind
        source: ${ADI_PG_DATA_DIR:?provide a dedicated PostgreSQL 18 directory}
        target: /var/lib/postgresql
        bind: {create_host_path: false}
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-adi.sql:ro
    command: ["postgres", "-c", "max_connections=40", "-c", "shared_buffers=512MB", "-c", "work_mem=4MB", "-c", "max_wal_size=256MB"]
    mem_limit: 2g
    cpus: 1
    shm_size: 128m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adi_bootstrap -d adi"]
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  default:
    name: adi
    external: true
